<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #000;
    color: white;
  }
  .wrapper {
    position: relative;
  }
  main {
    position: sticky;
    bottom: 0;
    background: #111;
    z-index: 1;
    border-radius: 0 0 20px 20px;
    transition: transform 0.3s;
  }
  .tall-content {
    height: 200vh;
    padding: 20px;
    background: linear-gradient(to bottom, #111, #333);
  }
  footer {
    position: relative;
    z-index: 2;
    height: 50vh;
    background: #22d3ee;
    color: black;
    padding: 20px;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="wrapper">
    <main>
      <div class="tall-content">
        <h1>Main Content</h1>
        <p>Scroll down...</p>
      </div>
    </main>
    <footer>
      <h1>Footer</h1>
      <p>This covers the main content!</p>
    </footer>
  </div>
</body>
</html>
